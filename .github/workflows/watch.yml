name: Check OPENTIX tickets
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    paths:
      - '.github/monitor-start'
  workflow_dispatch:
    inputs:
      test_notification:
        description: '發送 LINE 測試訊息（不代表有票）'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ticket-watch
  cancel-in-progress: false
jobs:
  watch:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test LINE and database
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        run: node test-connection.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      - name: Install packages
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_notification }}
        run: npm install --no-audit --no-fund
      - name: Install browser
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_notification }}
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_notification }}
        run: npm test
      - name: Check seats
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.test_notification }}
        run: npm run check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
